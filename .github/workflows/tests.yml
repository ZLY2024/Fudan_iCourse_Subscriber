name: Regression Tests

on:
  push:
    branches: [main]
    paths:
      - "main.py"
      - "src/**"
      - "scripts/data_branch.sh"
      - "tests/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "main.py"
      - "src/**"
      - "scripts/data_branch.sh"
      - "tests/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - run: bash -n scripts/data_branch.sh
